<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1c1410">
    <title>Offline — QRPOS Waiter</title>
    <style>
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            font-family: system-ui, sans-serif; text-align: center; padding: 2rem;
            color: #fff8f1; background: #1c1410;
        }
        img { width: 88px; height: 88px; border-radius: 20px; margin-bottom: 1rem; background: #0a0a0a; }
        h1 { font-size: 1.4rem; margin: 0 0 0.5rem; }
        p { color: rgba(255,248,241,0.7); margin: 0 0 1.25rem; line-height: 1.45; }
        button {
            border: 0; border-radius: 12px; padding: 0.85rem 1.25rem; font-weight: 700;
            background: #e8890c; color: #fff; cursor: pointer;
        }
    </style>
</head>
<body>
    <div>
        <img src="/pwa/waiter/icon-192.png" alt="QRPOS">
        <h1>You're offline</h1>
        <p>QRPOS Waiter Panel needs a connection.<br>Check Wi‑Fi, then try again.</p>
        <button type="button" onclick="location.reload()">Retry</button>
    </div>
</body>
</html>
